<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganaste un generador de luz</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/style8.css">
</head>
<body>

    <img src="/generadorDeLuz.png" alt="Feliz Cumpleaños Josuyelin" class="hero-img">
    <div class="overlay"></div>
    <div id="chispas"></div>

    <div class="wrap">
        <div class="caja">
            <div class="esquina esquina-tl"></div>
            <div class="esquina esquina-tr"></div>
            <div class="esquina esquina-bl"></div>
            <div class="esquina esquina-br"></div>

            <div class="separador">
                <span class="linea"></span>
                <svg class="rayo" width="26" height="34" viewBox="0 0 26 34"><path d="M15 1L2 20H12L10 33L24 13H14L15 1Z" fill="url(#rg)"/><defs><linearGradient id="rg" x1="2" y1="1" x2="24" y2="33"><stop offset="0%" stop-color="#fffbd6"/><stop offset="55%" stop-color="#ffd400"/><stop offset="100%" stop-color="#ff9500"/></linearGradient></defs></svg>
                <span class="linea"></span>
            </div>

            <p class="pre-titulo">¡FELICIDADES!</p>
            <h1 class="titulo">TE GANASTE UN<br>GENERADOR DE LUZ</h1>

            <div class="separador">
                <span class="linea"></span>
                <span class="icono">◆ ★ ◆</span>
                <span class="linea"></span>
            </div>

            <p class="mensaje">Esperemos y te sirva <span class="corazon">&lt;3</span></p>

            <div class="btn-wrap">
                <span class="bside l">✦ ✦</span>
                <div class="btn-outer">
                    <a href="Pagina9_cumple.html" class="btn">
                        Siguiente parte​<span class="bico">➜</span>
                    </a>
                </div>
                <span class="bside r">✦ ✦</span>
            </div>
        </div>
    </div>

    <audio id="sonido" preload="auto">
        <source src="/Musica/la quemona.mp3" type="audio/mpeg">
    </audio>

    <script>
        const sonido = document.getElementById("sonido");
        let yaSonado = false;

        function reproducirSonido() {
            if (yaSonado) return;
            yaSonado = true;
            sonido.play().catch(error => {
                console.log("No se pudo reproducir el audio:", error);
            });
        }

        window.addEventListener("load", () => {
            sonido.play().then(() => {
                yaSonado = true;
            }).catch(() => {
                console.log("Autoplay bloqueado, esperando interacción del usuario.");
            });
        });

        ["click", "keydown", "scroll", "touchstart", "mousemove"].forEach(evt => {
            document.addEventListener(evt, reproducirSonido, { once: true });
        });

        // chispas de energía flotando
        (function(){
            var cont = document.getElementById('chispas');
            var colores = ['#ffd400', '#ff9500', '#fff6c9', '#ffe066'];
            for (var i = 0; i < 22; i++){
                var s = document.createElement('div');
                var c = colores[i % colores.length];
                var d = (2.5 + Math.random() * 3.5).toFixed(2);
                var dl = (Math.random() * 6).toFixed(2);
                s.style.cssText = 'position:absolute;width:4px;height:4px;border-radius:50%;opacity:0;'
                    + 'left:' + (Math.random() * 100).toFixed(1) + '%;bottom:' + (Math.random() * 15).toFixed(1) + '%;'
                    + 'background:' + c + ';box-shadow:0 0 8px 3px ' + c + ';'
                    + 'animation:subirChispa ' + d + 's ' + dl + 's ease-in infinite;';
                cont.appendChild(s);
            }
        })();
    </script>
</body>
</html>
