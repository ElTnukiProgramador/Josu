<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok - Josuyelin</title>
    <link rel="stylesheet" href="/Styles/style3.css">
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <img src="/logo.png" alt="TikTok" class="logo-img">
    TikTok
  </div>
  <div class="search">🔍 Buscar</div>
  <nav>
    <a class="active">🏠 Para ti</a>
    <a>🧭 Explorador</a>
    <a>👥 Seguir</a>
    <a>👤 Amigos</a>
    <a>🔴 VIVIR</a>
    <a>💬 Mensajes <span class="badge">45</span></a>
    <a>🔔 Actividad <span class="badge">11</span></a>
    <a>⬆️ Cargar</a>
    <a>🙂 Perfil</a>
    <a>⋯ Más</a>
  </nav>
  <a href="/web/Pagina4_cumple.html" class="next-btn">➡ Siguiente parte</a>
</div>

<div class="main">

  <div class="video-container">

    <!-- Video de YouTube incrustado. Arranca muteado (los navegadores exigen esto
         para permitir el autoplay) y se desmutea solo apenas el usuario toca o
         hace click en cualquier parte de la página -->
    <iframe
      id="ytFrame"
      class="tiktok-video"
      style="width:100%;height:100%;border:0;"
      src="https://www.youtube.com/embed/0zc3gZzcwkw?autoplay=1&mute=1&loop=1&playlist=0zc3gZzcwkw&controls=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1"
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

    <div class="video-info">
      <p class="username">@josuyelin</p>
      <p class="description">el tanuki estraña a josurail pero el tanuki te hizo una sorpresa para josuyelin... #tanuki #josurail #apagones #pizza</p>
    </div>
  </div>

  <div class="side-actions">
    <div class="side-pfp-wrap">
      <img src="/perfil.png" class="profile-pic" alt="Josuyelin">
      <span class="follow-plus">+</span>
    </div>
    <div class="action" onclick="this.classList.toggle('liked')"><div class="icon">❤️</div><span class="count">45.4K</span></div>
    <div class="action"><div class="icon">💬</div><span class="count">94</span></div>
    <div class="action"><div class="icon">🔖</div><span class="count">3553</span></div>
    <div class="action"><div class="icon">↗</div><span class="count">597</span></div>
  </div>

</div>

<script>
  /* ═══════════════════════════════════════════
     Desmutear el video apenas el usuario interactúa.
     Los navegadores no dejan que el sonido arranque solo,
     así que en cuanto detectamos el primer click/tecla/toque
     le quitamos el mute automáticamente.
  ═══════════════════════════════════════════ */
  var ytPlayer = null;
  var yaDesmuteado = false;

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player('ytFrame', {
      events: {
        onReady: function () {
          desmutearSiPosible();
        }
      }
    });
  };

  function desmutearSiPosible() {
    if (yaDesmuteado || !ytPlayer || typeof ytPlayer.unMute !== 'function') return;
    try {
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      if (typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
      yaDesmuteado = true;
    } catch (err) {
      // el player puede no estar listo todavía; se reintentará con la próxima interacción
    }
  }

  ['click', 'touchstart', 'keydown'].forEach(function (evento) {
    document.addEventListener(evento, desmutearSiPosible, { once: false });
  });
</script>

<!-- API de YouTube: carga async y luego llama a window.onYouTubeIframeAPIReady -->
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
